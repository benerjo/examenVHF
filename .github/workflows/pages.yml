# Publie l'application d'entraînement VHF sur GitHub Pages.
# Seuls les fichiers du site sont publiés (pas qa/, tools/ ni .claude/).
name: Publication GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assembler le site
        run: |
          mkdir -p _site/data
          cp index.html app.js style.css manuel-vhf-2025.pdf _site/
          cp data/manuel-vhf-2025-qcm.js _site/data/
          touch _site/.nojekyll
          ls -lR _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
